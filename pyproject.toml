[project]
name = "shell-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "agentkit",
]

[project.scripts]
shai = "shell_ai.cli:main"

[tool.uv]
package = true

[tool.uv.sources]
agentkit = { path = "../agentkit", editable = true }

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"